[project]
name = "web-resolve"
version = "0.1.0"
description = "web-* resolve: orchestration — Request -> Document with policies + middleware. Depends on web-fetch, web-parse."
requires-python = ">=3.12"
dependencies = ["web-fetch", "web-parse", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[tool.uv.sources]
web-fetch = { path = "../fetch", editable = true }
web-parse = { path = "../parse", editable = true }

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
