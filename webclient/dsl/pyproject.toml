[project]
name = "web-dsl"
version = "0.1.0"
description = "web-* dsl: the lazy execution engine on top — record a Plan, dispatch sync/async/lazy/API over the plain layers."
requires-python = ">=3.12"
dependencies = [
    "web-fetch",
    "web-parse",
    "web-resolve",
    "web-crawl",
    "pydantic>=2",
    "python-dateutil>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[tool.uv.sources]
web-fetch = { path = "../fetch", editable = true }
web-parse = { path = "../parse", editable = true }
web-resolve = { path = "../resolve", editable = true }
web-crawl = { path = "../crawl", editable = true }

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
