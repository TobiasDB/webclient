# webclient service -- a minimal, horizontally scalable deployment.
# Sessions are node-local: route by session id at the ingress (sticky), size pool_pages
# to the pod's memory, autoscale on pool.waiting via /health.
apiVersion: apps/v1
kind: Deployment
metadata: { name: webclient }
spec:
  replicas: 2
  selector: { matchLabels: { app: webclient } }
  template:
    metadata: { labels: { app: webclient } }
    spec:
      containers:
        - name: webclient
          image: webclient:latest   # `make image` (target: browser) for JS tiers
          ports: [{ containerPort: 8000 }]
          env:
            - { name: WEBCLIENT_SERVICE_TOKEN, valueFrom: { secretKeyRef: { name: webclient, key: token } } }
            - { name: WEBCLIENT_SERVICE_SSRF_GUARD, value: "1" }
            - { name: WEBCLIENT_BROWSER__POOL_PAGES, value: "4" }
            - { name: WEBCLIENT_BROWSER__POOL_HTTP, value: "20" }
            - { name: WEBCLIENT_LIMITS__SESSION_PAGES, value: "2" }
            - { name: WEBCLIENT_LIMITS__PAGE_IDLE_TTL, value: "300" }
            - { name: WEBCLIENT_TRACES_DIR, value: "/traces" }
            - { name: WEBCLIENT_LOG_LEVEL, value: "INFO" }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 30 }
          volumeMounts: [{ name: traces, mountPath: /traces }]
      volumes:
        - name: traces
          persistentVolumeClaim: { claimName: webclient-traces }
---
apiVersion: v1
kind: Service
metadata:
  name: webclient
  annotations:
    # sticky sessions by cookie at the ingress (nginx example); the remote client's
    # session id also travels in every plan body for an application-level router.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "webclient-node"
spec:
  selector: { app: webclient }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: webclient }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: webclient }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    # a custom metric adapter can expose /health -> resources.pool.waiting as the queue-depth signal
