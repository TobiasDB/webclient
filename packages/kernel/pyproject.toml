[project]
name = "web-kernel"
version = "0.1.0"
description = "web-* kernel: the bottom layer — structured errors, the event bus, and the bounded loop. Depends on nothing but pydantic."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: `web` has no __init__; this distribution ships only web/kernel under it,
# but the `web` namespace dir is the package root so `web.kernel` resolves (editable + wheel).
packages = ["web"]
