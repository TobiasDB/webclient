[project]
name = "web-llm"
version = "0.1.0"
description = "web-* llm: the LLM client — a minimal Llm protocol + an Anthropic client. Depends on web-kernel + httpx."
requires-python = ">=3.12"
dependencies = ["web-kernel", "httpx>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[tool.uv.sources]
web-kernel = { path = "../kernel", editable = true }
