[project]
name = "web-onboard"
version = "0.1.0"
description = "web-* onboard: the capstone — goal -> dataset, composing crawl + agent + llm."
requires-python = ">=3.12"
dependencies = ["web-fetch", "web-parse", "web-resolve", "web-crawl", "web-agent", "web-dsl", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[tool.uv.sources]
web-fetch = { path = "../fetch", editable = true }
web-parse = { path = "../parse", editable = true }
web-resolve = { path = "../resolve", editable = true }
web-crawl = { path = "../crawl", editable = true }
web-agent = { path = "../agent", editable = true }
web-dsl = { path = "../dsl", editable = true }
