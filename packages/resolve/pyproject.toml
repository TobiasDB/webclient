[project]
name = "web-resolve"
version = "0.1.0"
description = "web-* resolve: orchestration — Request -> Document with policies + middleware. Depends on web-kernel, web-fetch, web-parse."
requires-python = ">=3.12"
dependencies = ["web-kernel", "web-fetch", "web-parse", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[tool.uv.sources]
web-kernel = { path = "../kernel", editable = true }
web-fetch = { path = "../fetch", editable = true }
web-parse = { path = "../parse", editable = true }
