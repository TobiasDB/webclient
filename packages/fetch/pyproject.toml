[project]
name = "web-fetch"
version = "0.1.0"
description = "web-* fetch: the transport layer — Request -> Snapshot. Depends only on web-kernel and httpx."
requires-python = ">=3.12"
dependencies = ["web-kernel", "httpx>=0.24", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[tool.uv.sources]
web-kernel = { path = "../kernel", editable = true }
