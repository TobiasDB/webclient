[project]
name = "web-fetch"
version = "0.1.0"
description = "web-* fetch: the transport layer — Request -> Snapshot. Depends only on httpx."
requires-python = ">=3.12"
dependencies = ["httpx>=0.24", "pydantic>=2"]

[project.optional-dependencies]
browser = ["playwright>=1.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[tool.uv.sources]
