[project]
name = "web-agent"
version = "0.1.0"
description = "web-* agent: the agent tier — a resumable observe/decide/apply loop that drives the lower layers (extraction authoring)."
requires-python = ">=3.12"
dependencies = ["web-kernel", "web-parse", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[tool.uv.sources]
web-kernel = { path = "../kernel", editable = true }
web-parse = { path = "../parse", editable = true }
