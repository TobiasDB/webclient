[project]
name = "web-crawl"
version = "0.1.0"
description = "web-* crawl: reach — seeds -> Documents, a frontier over web-resolve."
requires-python = ">=3.12"
dependencies = ["web-fetch", "web-parse", "web-resolve", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[tool.uv.sources]
web-fetch = { path = "../fetch", editable = true }
web-parse = { path = "../parse", editable = true }
web-resolve = { path = "../resolve", editable = true }

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
