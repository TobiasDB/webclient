[project]
name = "web-parse"
version = "0.1.0"
description = "web-* parse: interpretation — bytes -> Document (sniff, decode, select). Depends on lxml + pydantic only (no other layer)."
requires-python = ">=3.12"
dependencies = ["lxml>=4.9", "cssselect>=1.2", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

