[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webclient"
version = "0.1.0"
description = "Declarative web client: references, documents, live browser pages, lazy extraction plans"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typing_extensions>=4.5",
]

[project.optional-dependencies]
# Local parsing/extraction (Document.select/render). Not needed by the
# RemoteWebClient, which parses server-side.
local = ["lxml>=5.0", "cssselect>=1.2", "charset-normalizer>=3.0"]
browser = ["playwright>=1.40"]                 # M4 LiveDocument
service = ["fastapi>=0.110", "uvicorn>=0.29"]  # M7 browser-as-a-service
# `remote` needs nothing beyond the base deps (httpx + pydantic).
remote = []
dev = ["pytest>=8", "pytest-httpserver>=1.0", "mypy>=1.10", "pyright>=1.1.380",
       "lxml-stubs",
       "lxml>=5.0", "cssselect>=1.2", "charset-normalizer>=3.0",
       "playwright>=1.40", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
include = ["webclient*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# The project targets 3.12 (requires-python). Pin it so pyright does not fall
# back to the system interpreter's version for stdlib typing (assert_type etc.).
pythonVersion = "3.12"
