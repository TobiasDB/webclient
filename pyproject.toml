# Repo-root tooling config for the layered web.* packages under webclient/.
#
# This root is no longer an installable package -- each webclient/<pkg>/ is its own package with
# its own pyproject. Kept here is the AUTHORITATIVE formatting config: `isort webclient/` and
# `black webclient/` run from the repo root resolve ONE config (black picks the config at the
# common root of the paths it is given -- here). Each webclient/*/pyproject.toml mirrors these
# values so a per-package invocation agrees.

[tool.pyright]
# Target 3.12 (the packages' requires-python); pin it so stdlib typing resolves correctly.
pythonVersion = "3.12"
# Resolve optional deps (lxml, playwright, ...) from the uv-managed venv.
venvPath = "."
venv = "env"
# The typed DSL surface is value-dependent overloads (attr href->Reference vs str->Field) and the
# code-generated stubs declare overloads without an implementation body -- intentional.
reportOverlappingOverload = false
reportNoOverloadImplementation = false

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
