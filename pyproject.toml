[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "webclient"
version = "0.1.0"
description = "Declarative web client: references, documents, live browser pages, lazy extraction plans"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.0",  # env-loadable Settings
    "pyyaml>=5",             # brief frontmatter parsing
    "httpx>=0.24",
    "typing_extensions>=4.5",
    "typeguard>=4.0",
]

[project.optional-dependencies]
# Local parsing/extraction (Document.select/render). Not needed by the
# RemoteWebClient, which parses server-side.
local = ["lxml>=4.9", "cssselect>=1.2", "charset-normalizer>=3.0"]
browser = ["playwright>=1.30"]                 # M4 LiveDocument
service = ["fastapi>=0.100", "uvicorn>=0.23"]  # M7 browser-as-a-service
# `remote` needs nothing beyond the base deps (httpx + pydantic).
remote = []
dev = ["pytest>=7.4", "pytest-httpserver>=1.0", "mypy>=1.10", "pyright>=1.1.380",
       "lxml-stubs", "types-PyYAML",
       "lxml>=4.9", "cssselect>=1.2", "charset-normalizer>=3.0",
       "playwright>=1.30", "fastapi>=0.100", "uvicorn>=0.23"]

[tool.setuptools.packages.find]
include = ["webclient*"]

# PEP 561: ship the py.typed marker so downstream type checkers use the inline
# types (the package is mypy --strict + pyright clean).
[tool.setuptools.package-data]
webclient = ["py.typed", "skills/*.md"]
# The onboarding pipeline's prompts + reusable briefs ship as package data (loaded
# via importlib.resources from webclient.pipelines).
"webclient.pipelines.prompts" = ["*.md"]
"webclient.pipelines" = ["briefs/*.md"]

# The `onboard` CLI: `onboard <brief> <company> [<company> ...]`.
[project.scripts]
onboard = "webclient.pipelines.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# The code-generated type-only surface stubs (scripts/gen_stubs.py) are `...`-body
# declarations validated at their use-site by tests/fixtures/typing_surface.py.
# Checking their DEFINITIONS trips codes that are inherent to stub form; suppress
# only those, only here -- every other strict check still applies to these files.
[[tool.mypy.overrides]]
module = [
    "webclient.surfaces.lazy",
    "webclient.surfaces.eager",
    "webclient.collection",
    # the html backing hand-writes the same intentionally-overlapping backing
    # overloads (attr href->Reference vs str->Field; render by format) the stubs
    # are generated from -- the overlap is by design.
    "webclient.core.document.html",
    # the cores' generated eager-op interface (``IDocument`` / ``IReference`` /
    # ``IWebClient``, in each core's models.py, which the core inherits) -- same
    # ``...``-body stub form.
    "webclient.core.document.models",
    "webclient.core.reference.models",
    "webclient.core.client.models",
    "webclient.core.crawl.models",
]
disable_error_code = [
    "empty-body",
    "no-overload-impl",
    "overload-overlap",
    "unused-ignore",  # the codegen'd/backing overlap ignores are moot under the above
]

# A backing op declares its SURFACE return type (what ``gen_stubs`` renders) but
# returns a value that is ``Any`` because the cores cross-reference through some
# ``Any``-typed private attrs (``_page`` is a playwright Page). That is the intended
# pattern -- the surface stubs re-assert the type, so backings do NOT ``cast``.
# Relax only ``no-any-return`` on ``live`` (``return core`` on the Any page). The
# client's ``summary`` no longer needs it: DocumentCore now implements ``summary``
# (via its interface), so ``doc.summary(...)`` is typed, not ``dispatch(...) -> Any``.
[[tool.mypy.overrides]]
module = [
    "webclient.core.document.live",
]
disable_error_code = ["no-any-return"]

[tool.pyright]
# The project targets 3.12 (requires-python). Pin it so pyright does not fall
# back to the system interpreter's version for stdlib typing (assert_type etc.).
pythonVersion = "3.12"
# Resolve optional deps (lxml, playwright) from the uv-managed venv.
venvPath = "."
venv = "env"
# The library's core pattern is value-dependent overloads (attr href->Reference
# vs str->Field; render by format) -- intentionally overlapping -- and the
# code-generated surface stubs declare overloads without an implementation body
# (validated at their use-site by tests/fixtures/typing_surface.py).
reportOverlappingOverload = false
reportNoOverloadImplementation = false
