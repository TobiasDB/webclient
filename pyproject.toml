[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webclient"
version = "0.2.0"
description = "Declarative web client: references, documents, and one expression language over both"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "anyio>=4.0",
    "lxml>=5.0",
    "cssselect>=1.2",
    "charset-normalizer>=3.0",
    "typing_extensions>=4.5",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = [
    "pytest>=8", "pytest-httpserver>=1.0", "mypy>=1.10", "lxml-stubs",
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
include = ["webclient*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["webclient"]
strict = false
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
